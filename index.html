                <!-- Inside your <form id="form-inputs"> -->

                <div class="input-group">
                    <label for="asset-name">Asset Name</label>
                    <input type="text" id="asset-name" placeholder="Bitcoin (BTC)" required>
                </div>

                <div class="input-group">
                    <label for="buy-price">Buy Price($)</label> 
                    <input type="number" step="0.01" id="buy-price" placeholder="10.00" required>
                </div>

                <div class="input-group">
                    <label for="current-price">Current Price</label> 
                    <input type="number" step="0.01" id="current-price" placeholder="15.00" required>
                </div>

                <button type="submit">Add to Watchlist</button>



            </form>
        </div>

        <div id="watchlist-output">
            <h2>My Watchlist</h2>

            <ul id="watchlist-container">
                <li>
                    <span class="asset-name-part">Bitcoin</span>                                  
                    <span class="buy-part">Buy: $10.00</span>
                    <span class="current-part">Current: $15.00</span>
                    <span class="percentage-part profit-text">+50.00%</span>
                </li>

                <li>
                    <span class="asset-name-part">Etherium</span>                                  
                    <span class="buy-part">Buy: $12.00</span>
                    <span class="current-part">Currrent: $10.00</span>
                    <span class="percentage-part loss-text">-10.00%</span>
                </li>
            </ul>
        </div>
